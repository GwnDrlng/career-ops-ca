# Guardrails — single source of truth for the re-architected pipeline.
# Referenced by: pipeline/route-tier.mjs, pipeline/judge.mjs, pipeline/token-budget.mjs,
# pipeline/applier.mjs, watcher/watch.mjs.
# Changing a value here is itself a governance action — log the change + reason
# to data/audit-log.tsv when this file is edited (see RE_ARCHITECTURE.md Part 7F).

tiers:
  ignore_max: 2.0       # score <= this -> log only, no report stored beyond scan-history
  generic_min: 2.1      # generic CV + applier lane starts here
  generic_max: 3.6       # generic CV + applier lane ends here
  curated_min: 3.7       # curated CV+CL + judge lane starts here

judge:
  pass_threshold_pct: 90   # overall score must be >= this to pass
  max_retries: 2            # 2 retries = 3 total attempts
  history_log: "data/judge-history.tsv"

volume_caps:
  max_applications_per_day: 8
  max_applications_per_company_per_week: 2
  max_applications_per_portal_per_hour: 4

token_budget:
  rolling_5h_block_pct: 75   # halt new Opus work above this % of the rolling 5h block
  weekly_pct: 60              # halt new Opus work above this % of the weekly allowance
  rolling_5h_block_limit_tokens: 400000   # 2026-07-02: doubled from 200000 (gwen) to give the live apply pipeline more 5h headroom; still an ESTIMATE for Claude Pro's 5h block — tune from data/token-usage.tsv
  weekly_limit_tokens: 2000000            # 2026-07-03: doubled from 1000000 (gwen) to raise the weekly ceiling; still an ESTIMATE for Claude Pro's weekly window — tune from data/token-usage.tsv
  ledger: "data/token-usage.tsv"

approval:
  channel: "#job-approvals"
  expiry_hours: 12     # a stale (unactioned) approval request is never submitted
  single_use: true      # an approval token cannot be replayed
  # Slack user IDs (not @handles — the "U0..." ids) allowed to approve a submit
  # or send /pause /resume. Empty = nobody can approve, so nothing can ever be
  # auto-submitted until you add yourself here. Find your id: click your Slack
  # profile -> More -> Copy member ID.
  verified_approver_ids: ["U0BF4GVPKHN"]

auto_pause:
  consecutive_failures: 3   # this many consecutive submit failures trips the kill switch
  notify_channel: "#job-approvals"

legitimacy_gate:
  allow: ["High Confidence", "Proceed with Caution"]
  drop: ["Suspicious"]   # never auto-filled, PII never sent

auto_fill_scope:
  ats_allowlist: ["greenhouse", "ashby", "lever", "workable"]
  # any other host -> draft-only answers for manual copy-paste, no programmatic fill

apply_enabled: true   # LIVE — applier fills real forms + posts approval requests to #job-approvals (2026-07-02, gwen; nothing auto-submits, each apply still needs a Slack approve token)

schedule:
  # The cloud daily-scan cron (cloud/agent/schedules/daily-scan.ts is "0 12 * * *").
  # On-prem reads this to compute the auto-resume time for `budget-defer` (stop the
  # pipeline until the next daily run). Keep in sync with that schedule file.
  daily_scan_utc_hour: 12
  daily_scan_utc_minute: 0

slack:
  # Channel IDs, not secrets — safe to commit. The bot token itself lives ONLY
  # in macOS Keychain (service "career-ops-slack-bot-token"), never in a file.
  job_pipeline_channel_id: "C0BF4H3V280"   # graded reports + non-sensitive flags
  job_approvals_channel_id: "C0BF5SM97B2"  # private, restricted membership — the actual submit-approval gate
  keychain_service: "career-ops-slack-bot-token"

cost:
  monthly_cap_usd: 50          # notional API-equivalent USD ceiling for this pipeline's Opus spend (see note: on a Pro subscription this is a usage proxy, not a real bill)
  monthly_pct: 75              # halt new Opus work once this-month spend reaches this % of monthly_cap_usd
  per_application_cap_usd: 2   # hard USD ceiling for one application's Opus spend (~4-6 Opus calls); halts further calls for that job

audit:
  # Append-only accountability ledger (pipeline/audit.mjs): routing decisions,
  # pause/resume, approvals, fills, submits, refusals. Gitignored.
  log: "data/audit-log.tsv"

calibration:
  # Grading calibration spot-check (pipeline/calibrate.mjs): re-grade a
  # cloud-graded job on-prem and flag if the two scores diverge by more than
  # drift_threshold (on the 1-5 scale). Measures only — never blocks. Gitignored.
  drift_threshold: 0.4
  log: "data/calibration-log.tsv"

dead_letter:
  # A Slack message that fails processing this many times in a row is moved to
  # the dead-letter ledger and skipped, so one poison message can't block the
  # whole queue (pipeline/dead-letter.mjs). Gitignored.
  max_retries: 3
  store: "data/dead-letter.tsv"

budget_override:
  # Manual "continue anyway" when a token/cost ceiling halts an Opus call
  # (pipeline/budget-override.mjs). On halt, Slack names the ceiling + gives an
  # override token; a verified approver (approval.verified_approver_ids) replies
  # `budget-override <token>` to allow work to proceed despite the ceiling.
  channel: "#job-approvals"
  expiry_hours: 12      # an unactioned override token older than this is dead
  grant_calls: 3         # how many Opus calls one approved override permits (bounded overspend)
  wait_seconds: 0        # 0 = halt now, override applies to the next run; >0 = a halted call
                          # blocks up to N seconds in-process waiting for approval, then continues

cloud:
  # Deployed eve agent (Vercel). Used by scan-now.mjs to trigger the daily-scan
  # pipeline on demand, outside the cron. The alias is stable across redeploys.
  # Override per-invocation with --url, or the CAREER_OPS_CLOUD_URL env var.
  deployment_url: "https://cloud-xi-eight.vercel.app"
  # Slash-command endpoint path (cloud/agent/channels/slack-commands.ts). eve
  # mounts a custom-channel route at its literal path (no /eve/v1 prefix), so
  # this IS the full path. Set {deployment_url}{slash_command_path} as the
  # Request URL of the Slack /scan slash command.
  slash_command_path: "/slack/commands"
